[workspace]
members = ["crates/*"]

[package]
name = "pumba-board"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "pumba"
path = "src/main.rs"

[dependencies]
pumba-core = { path = "crates/pumba-core" }
pumba-install = { path = "crates/pumba-install" }
pumba-tui = { path = "crates/pumba-tui" }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
